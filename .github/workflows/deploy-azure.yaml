name: Build and release code
on:
  push:
    branches: [main]

env:
  AZURE_WEBAPP_API_NAME_UI: geekoff-2021
  AZURE_WEBAPP_PACKAGE_PATH_UI: './ClientApp/dist/ClientApp'
  AZURE_WEBAPP_API_NAME_API: geekoff-2021api
  AZURE_WEBAPP_PACKAGE_PATH_API: './webapi'
  NODE_VERSION: '18.x'

jobs:
  generate_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Generate version
        id: version
        run: |
          VERSION="v$(date +'%Y.%m.%d')-${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

  build_and_test_node:
    runs-on: ubuntu-latest
    needs: generate_version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
  
      - name: Replace tokens
        uses: cschleiden/replace-tokens@v1.3
        with:
          tokenPrefix: '#{'
          tokenSuffix: '}#'
          files: ClientApp/src/configurations/prod/auth-config.ts
        env:
          AUTHORITY: ${{ secrets.AD_AUTHORITY }}
          CLIENT_ID: ${{ secrets.AD_CLIENT_ID }}
          SCOPE: ${{ secrets.AD_SCOPE }}
          
      - name: Copy prod file to location
        run: |
          cp ClientApp/src/configurations/prod/auth-config.ts ClientApp/src/auth
          ls ClientApp/src
      
      - name: npm install, build, and test
        working-directory: ./ClientApp
        run: |
          npm install
          npm run build --if-present
          
      - name: Zip Release
        uses: TheDoctor0/zip-release@0.7.6
        with:
          filename: ui.zip
          path: .
          directory: ./ClientApp/dist

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-build
          path: ./ClientApp/dist/ui.zip
            
      - name: 'Deploy to Azure WebApp'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_API_NAME_UI }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_UI }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH_UI }}

  build_net_core:
    runs-on: ubuntu-latest
    needs: generate_version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        working-directory: ./GeekOff.API
        run: dotnet restore

      - name: Build
        run: |
          cd GeekOff.API
          dotnet build --configuration Release --no-restore
          dotnet publish -c Release -o ../webapi -r linux-x64 --self-contained true /p:UseAppHost=true
          ls ../webapi
          
      - name: Zip Release
        uses: TheDoctor0/zip-release@0.7.6
        with:
          filename: webapi.zip
          path: .
          directory: ./webapi

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: ./webapi/webapi.zip

      - name: 'Deploy to Azure WebApp'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_API_NAME_API }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH_API }}

  create_release:
    runs-on: ubuntu-latest
    needs: [generate_version, build_and_test_node, build_net_core]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download UI artifact
        uses: actions/download-artifact@v5
        with:
          name: ui-build
          path: ./artifacts

      - name: Download API artifact
        uses: actions/download-artifact@v5
        with:
          name: api-build
          path: ./artifacts

      - name: Create Git tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag ${{ needs.generate_version.outputs.tag }}
          git push origin ${{ needs.generate_version.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.generate_version.outputs.tag }}
          name: Release ${{ needs.generate_version.outputs.version }}
          body: |
            ## GeekOff Release ${{ needs.generate_version.outputs.version }}
            
            This release includes:
            - 🌐 Frontend (Angular) application
            - 🔧 Backend (.NET) API
            
            **Deployed from:** `${{ github.sha }}`
            **Workflow run:** ${{ github.run_number }}
          files: |
            ./artifacts/ui.zip
            ./artifacts/webapi.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
